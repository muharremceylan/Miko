# Bir VPS/Docker sunucusunda çalışır. GitHub Pages bot çalıştırmaz; ücretli servis açmaz.
services:
  telegram-pdf:
    build:
      context: ../..
      dockerfile: services/telegram/Dockerfile
    env_file: .env
    restart: unless-stopped
    init: true
    user: "10001:10001"
    volumes:
      - telegram-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-m", "services.telegram.bot", "--healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
volumes:
  telegram-data:
