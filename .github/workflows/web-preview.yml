name: Akademi AI web önizlemesi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'akademi_ai_prototip/index.html'
      - 'apps/capacitor/package.json'
      - 'apps/capacitor/package-lock.json'
      - 'apps/capacitor/src/**'
      - 'apps/capacitor/scripts/build.mjs'
      - 'apps/capacitor/scripts/export_web.mjs'
      - '.github/workflows/web-preview.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/capacitor
    steps:
      - name: Kaynakları al
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Node.js kur
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/capacitor/package-lock.json
      - name: Kilitli bağımlılıkları kur
        run: npm ci --no-audit --no-fund
      - name: Köprü davranışlarını test et
        run: npm test
      - name: Web önizlemesini hazırla
        run: npm run export:web
      - name: Pages ayarlarını oku
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Web dosyalarını paketle
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/capacitor/web-release
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages yayını
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Canlı web sayfalarını doğrula
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request
          from urllib.parse import urljoin
          base = os.environ['PREVIEW_URL'].rstrip('/') + '/'
          checks = [('', 'Mobil web önizlemesi'), ('app.html', 'KPSS düzeyini seç'), ('app.js', 'function selectKpssLevel'), ('app.js', 'const mathAnnualRows='), ('preview.js', 'resizePreview')]
          for path, expected in checks:
              url = urljoin(base, path) + '?build=' + os.environ['GITHUB_SHA']
              for attempt in range(6):
                  try:
                      request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read().decode('utf-8')
                          if response.status != 200 or expected not in body:
                              raise RuntimeError('Beklenen web içeriği bulunamadı: ' + path)
                      break
                  except (urllib.error.URLError, RuntimeError):
                      if attempt == 5:
                          raise
                      time.sleep(5)
          print('::notice title=Canlı web önizlemesi doğrulandı::' + base)
          PY
